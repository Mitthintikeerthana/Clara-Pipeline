<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clara Pipeline — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --muted: #8892b0;
      --radius: 10px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .logo span { color: var(--accent2); }
    .badge {
      background: var(--accent);
      color: white;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 60px); }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem 0;
    }
    .sidebar-title {
      padding: 0.5rem 1.25rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
    }
    .account-item {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .account-item:hover { background: var(--surface2); }
    .account-item.active {
      background: var(--surface2);
      border-left-color: var(--accent);
    }
    .account-item .name { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
    .account-item .meta { font-size: 0.75rem; color: var(--muted); }
    .v2-tag {
      display: inline-block;
      background: var(--accent2);
      color: #0a1628;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }
    .stage-tag {
      display: inline-block;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-left: 4px;
      vertical-align: middle;
    }
    .stage-demo    { background: #334; color: var(--muted); }
    .stage-purchased { background: #3a2e0a; color: var(--warn); }
    .stage-onboarded { background: #0a2820; color: var(--accent2); }
    .journey {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 0.25rem;
    }
    .journey-step {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
    }
    .journey-step.done { background: var(--accent); color: white; border-color: var(--accent); }
    .journey-step.active { background: var(--accent2); color: #0a1628; border-color: var(--accent2); }
    .journey-arrow { color: var(--muted); padding: 0 0.35rem; font-size: 0.8rem; }
    .main { overflow-y: auto; padding: 1.5rem 2rem; }
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      gap: 0.75rem;
    }
    .placeholder .icon { font-size: 3rem; }
    .placeholder p { font-size: 0.9rem; }
    .tabs { display: flex; gap: 0.25rem; margin-bottom: 1.5rem; }
    .tab {
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-bottom: none;
      background: var(--surface);
      color: var(--muted);
      transition: all 0.15s;
    }
    .tab.active { background: var(--surface2); color: var(--text); border-color: var(--border); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent2);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .field { margin-bottom: 0.6rem; }
    .field-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .field-value { font-size: 0.9rem; }
    .pill {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.8rem;
      margin: 2px 2px;
    }
    .contact-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .contact-order {
      background: var(--accent);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    pre {
      background: #0a0d15;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
    }
    .diff-section { margin-bottom: 1rem; }
    .diff-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 0.5rem; }
    .diff-row {
      display: grid;
      grid-template-columns: 200px 1fr 1fr 1fr;
      gap: 0.5rem;
      padding: 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.25rem;
      font-size: 0.8rem;
      align-items: center;
    }
    .diff-row:nth-child(odd) { background: var(--surface2); }
    .diff-row .field-path { font-family: monospace; color: var(--accent); }
    .diff-old { color: var(--danger); }
    .diff-new { color: var(--accent2); }
    .diff-reason { color: var(--muted); font-style: italic; }
    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat-box .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-box .label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .summary-row {
      display: grid;
      grid-template-columns: 160px 120px 80px 1fr 80px;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.83rem;
      align-items: center;
    }
    .summary-row:nth-child(odd) { background: var(--surface2); }
    .status-ok { color: var(--accent2); font-weight: 600; }
    .status-fail { color: var(--danger); font-weight: 600; }
    .loading { color: var(--muted); font-size: 0.9rem; padding: 2rem; text-align: center; }
    .no-data { color: var(--muted); font-style: italic; font-size: 0.85rem; padding: 0.5rem 0; }
    h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .separator { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
    .source-badge {
      display: inline-block;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }
    .source-form { background: #2a1a3a; color: #b48cf7; border: 1px solid #5a3a8a; }
    .source-transcript { background: #0d2a1e; color: var(--accent2); border: 1px solid #1a5a3a; }
    .conflict-row {
      display: grid;
      grid-template-columns: 180px 1fr 1fr 1fr;
      gap: 0.5rem;
      padding: 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.25rem;
      font-size: 0.8rem;
      align-items: start;
      background: rgba(239,68,68,0.05);
      border-left: 3px solid var(--danger);
    }
    .conflict-row .field-path { font-family: monospace; color: var(--accent); }
    .conflict-resolution { color: var(--accent2); font-style: italic; font-size: 0.75rem; }
  </style>
</head>
<body>

<header>
  <div class="logo">Clara<span>Pipeline</span></div>
  <div class="badge">v1.0</div>
  <span style="margin-left:auto; color:var(--muted); font-size:0.85rem;" id="header-status">Loading...</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">Accounts</div>
    <div id="account-list"><div class="loading">Loading...</div></div>
  </aside>

  <main class="main" id="main-content">
    <div id="summary-view"><div class="loading">Loading summary...</div></div>
  </main>
</div>

<script type="module">
const API = '';

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function escHtml(s) {
  if (s == null) return '<em class="no-data">—</em>';
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function lifecycleBadge(stage) {
  if (stage === 'demo_complete') return '<span class="stage-tag stage-demo">Demo</span>';
  if (stage === 'purchased') return '<span class="stage-tag stage-purchased">Purchased</span>';
  if (stage === 'onboarding_complete') return '<span class="stage-tag stage-onboarded">Onboarded</span>';
  return '';
}

function renderJourney(stage) {
  const steps = [
    { key: 'demo_complete', label: 'Demo Complete' },
    { key: 'purchased',     label: 'Purchased' },
    { key: 'onboarding_complete', label: 'Onboarded' },
  ];
  const order = { demo_complete: 0, purchased: 1, onboarding_complete: 2 };
  const current = order[stage] ?? -1;
  const html = steps.map((s, i) => {
    let cls = '';
    if (i < current) cls = 'done';
    else if (i === current) cls = 'active';
    const arrow = i < steps.length - 1 ? '<span class="journey-arrow">&#8594;</span>' : '';
    return `<span class="journey-step ${cls}">${s.label}</span>${arrow}`;
  }).join('');
  return `<div class="card">
    <div class="card-title">Lifecycle Journey</div>
    <div class="journey">${html}</div>
  </div>`;
}

function pills(arr) {
  if (!arr || !arr.length) return '<em class="no-data">None</em>';
  return arr.map(s => `<span class="pill">${escHtml(s)}</span>`).join('');
}

function truncate(val, n=80) {
  if (val == null) return '—';
  const s = typeof val === 'object' ? JSON.stringify(val) : String(val);
  return s.length > n ? s.slice(0, n) + '...' : s;
}

async function loadAccounts() {
  try {
    const accounts = await fetchJSON(`${API}/api/accounts`);
    const el = document.getElementById('account-list');
    if (!accounts.length) {
      el.innerHTML = '<div class="loading">No accounts found.<br>Run the batch runner first.</div>';
      document.getElementById('header-status').textContent = '0 accounts';
      return;
    }
    document.getElementById('header-status').textContent = `${accounts.length} account${accounts.length===1?'':'s'}`;
    el.innerHTML = accounts.map(a => `
      <div class="account-item" data-id="${a.account_id}" id="item-${a.account_id}">
        <div class="name">${escHtml(a.company_name)}${a.has_v2?'<span class="v2-tag">v2</span>':''}${lifecycleBadge(a.lifecycle_stage)}</div>
        <div class="meta">${a.account_id} &middot; ${a.versions.join(', ')}</div>
      </div>
    `).join('');
    document.getElementById('account-list').addEventListener('click', e => {
      const item = e.target.closest('[data-id]');
      if (item) loadAccount(item.dataset.id);
    });
  } catch(e) {
    document.getElementById('account-list').innerHTML = `<div class="loading" style="color:var(--danger)">Error: ${e.message}</div>`;
  }
}

async function loadSummary() {
  const el = document.getElementById('summary-view');
  try {
    const s = await fetchJSON(`${API}/api/summary`);
    if (s.error) { el.innerHTML = renderNoSummary(); return; }
    el.innerHTML = renderSummary(s);
  } catch(e) {
    console.warn('Summary not available:', e.message);
    el.innerHTML = renderNoSummary();
  }
}

function renderNoSummary() {
  return `<div class="placeholder">
    <div class="icon">🏢</div>
    <h3>Select an account</h3>
    <p>Choose an account from the sidebar to view its configuration,<br>agent spec, and changelog.</p>
    <p style="color:var(--muted);font-size:0.8rem;margin-top:1rem">Run the batch pipeline first to see results here.</p>
  </div>`;
}

function statusColor(status) {
  if (status === 'success') return 'var(--accent2)';
  if (status === 'skipped') return 'var(--warn)';
  return 'var(--danger)';
}

function renderSummaryResultTable(title, results, isA) {
  const rows = results.map(r => {
    const color = statusColor(r.status);
    const extra = isA ? `${r.elapsed_sec}s` : (r.total_changes ?? '—');
    return `<div class="summary-row">
      <span>${escHtml(r.account_id)}</span>
      <span>${escHtml(r.company||'—')}</span>
      <span style="color:${color};font-weight:600">${r.status}</span>
      <span style="color:var(--danger);font-size:0.8rem">${escHtml(r.error||'')}</span>
      <span>${extra}</span>
    </div>`;
  }).join('');
  const lastCol = isA ? 'Time' : 'Changes';
  return `<div class="card">
    <div class="card-title">${title}</div>
    <div class="summary-row" style="font-size:0.75rem;color:var(--muted);font-weight:600">
      <span>Account</span><span>Company</span><span>Status</span><span>Error</span><span>${lastCol}</span>
    </div>${rows}
  </div>`;
}

function renderSummary(s) {
  const aResults = s.pipeline_a_results || [];
  const bResults = s.pipeline_b_results || [];
  return `
    <h2>Pipeline Run Summary</h2>
    <p class="subtitle">Last run: ${escHtml(s.run_at)}</p>
    <div class="grid-3">
      <div class="stat-box"><div class="num" style="color:var(--accent2)">${s.successes||0}</div><div class="label">Succeeded</div></div>
      <div class="stat-box"><div class="num" style="color:var(--warn)">${s.skipped||0}</div><div class="label">Skipped</div></div>
      <div class="stat-box"><div class="num" style="color:var(--danger)">${s.failures||0}</div><div class="label">Failed</div></div>
    </div><br>
    ${aResults.length ? renderSummaryResultTable('Pipeline A — Demo → v1', aResults, true) : ''}
    ${bResults.length ? renderSummaryResultTable('Pipeline B — Onboarding → v2', bResults, false) : ''}
    <p style="color:var(--muted);font-size:0.8rem;margin-top:1rem">Select an account from the sidebar to view full details.</p>
  `;
}

async function loadAccount(accountId) {
  document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById(`item-${accountId}`);
  if (item) item.classList.add('active');

  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Loading account data...</div>';

  try {
    const data = await fetchJSON(`${API}/api/account/${accountId}`);
    if (data.error) throw new Error(data.error);
    renderAccount(data, main);
  } catch(e) {
    main.innerHTML = `<div class="placeholder"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
  }
}

function renderAccount(data, container) {
  const v1 = data.v1 || {};
  const v2 = data.v2;
  const memo = v1.memo || {};

  const tabsHTML = `
    <div class="tabs" id="tab-bar">
      <div class="tab active" data-tab="overview">Overview</div>
      <div class="tab" data-tab="memo">Account Memo</div>
      <div class="tab" data-tab="prompt">Agent Prompt</div>
      <div class="tab" data-tab="spec">Agent Spec JSON</div>
      ${v2 ? '<div class="tab" data-tab="diff">v1 \u2192 v2 Diff</div>' : ''}
    </div>
    <div id="tab-overview" class="tab-pane active">${renderOverview(data)}</div>
    <div id="tab-memo" class="tab-pane">${renderMemo(v1.memo, 'v1')}${v2 ? renderMemo(v2.memo,'v2') : ''}</div>
    <div id="tab-prompt" class="tab-pane">${renderPrompt(v1.system_prompt, 'v1')}${v2&&v2.system_prompt?renderPrompt(v2.system_prompt,'v2'):''}</div>
    <div id="tab-spec" class="tab-pane">${renderSpec(v1.agent_spec, 'v1')}${v2&&v2.agent_spec?renderSpec(v2.agent_spec,'v2'):''}</div>
    ${v2 ? `<div id="tab-diff" class="tab-pane">${renderDiff(v2)}</div>` : ''}
  `;

  container.innerHTML = `
    <h2>${escHtml(memo.company_name || data.account_id)}</h2>
    <p class="subtitle">${data.account_id} &mdash; ${escHtml(memo.office_address || '')}</p>
    ${tabsHTML}
  `;

  container.querySelector('#tab-bar').addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) showTab(tab.dataset.tab);
  });
}

function showTab(name) {
  document.querySelectorAll('#tab-bar .tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => {
    p.classList.toggle('active', p.id === `tab-${name}`);
  });
}

function renderOverview(data) {
  const m = data.v1?.memo || {};
  const bh = m.business_hours || {};
  const er = m.emergency_routing_rules || {};
  const contacts = (er.contacts||[]).sort((a,b)=>a.order-b.order);

  return `
    ${data.lifecycle_stage ? renderJourney(data.lifecycle_stage) : ''}
    <div class="grid-3">
      <div class="stat-box"><div class="num">${(m.services_supported||[]).length}</div><div class="label">Services</div></div>
      <div class="stat-box"><div class="num">${contacts.length}</div><div class="label">Emergency Contacts</div></div>
      <div class="stat-box"><div class="num">${data.v2?'v2':'v1'}</div><div class="label">Current Version</div></div>
    </div>
    <br>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Business Hours</div>
        <div class="field"><div class="field-label">Days</div><div class="field-value">${pills(bh.days)}</div></div>
        <div class="field"><div class="field-label">Hours</div><div class="field-value">${escHtml(bh.start)} \u2013 ${escHtml(bh.end)}</div></div>
        <div class="field"><div class="field-label">Timezone</div><div class="field-value">${escHtml(bh.timezone)}</div></div>
      </div>
      <div class="card">
        <div class="card-title">Services Offered</div>
        ${pills(m.services_supported)}
        ${(m.services_excluded||[]).length ? `<div style="margin-top:0.75rem"><div class="field-label">Not offered</div>${pills(m.services_excluded)}</div>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-title">Emergency Contacts (in order)</div>
      ${contacts.map(c=>`
        <div class="contact-card">
          <div class="contact-order">${c.order}</div>
          <div><strong>${escHtml(c.name)}</strong><br><span style="color:var(--muted);font-size:0.85rem">${escHtml(c.phone)}</span></div>
        </div>`).join('') || '<em class="no-data">None on file</em>'}
      ${er.fallback?`<div style="margin-top:0.75rem"><span class="field-label">Fallback: </span>${escHtml(er.fallback)}</div>`:''}
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Integration Constraints</div>
        ${pills(m.integration_constraints)}
      </div>
      <div class="card">
        <div class="card-title">Special Routing Rules</div>
        ${pills(m.special_constraints)}
      </div>
    </div>
    ${(m.questions_or_unknowns||[]).length ? `
    <div class="card" style="border-color: var(--warn);">
      <div class="card-title" style="color:var(--warn)">Open Questions / Unknowns</div>
      ${pills(m.questions_or_unknowns)}
    </div>` : ''}
  `;
}

function renderMemo(memo, ver) {
  if (!memo) return '';
  return `<div class="card">
    <div class="card-title">Account Memo — ${ver.toUpperCase()}</div>
    <pre>${escHtml(JSON.stringify(memo, null, 2))}</pre>
  </div>`;
}

function renderPrompt(prompt, ver) {
  if (!prompt) return '<em class="no-data">Prompt not generated yet.</em>';
  return `<div class="card">
    <div class="card-title">System Prompt — ${ver.toUpperCase()}</div>
    <pre>${escHtml(prompt)}</pre>
  </div>`;
}

function renderSpec(spec, ver) {
  if (!spec) return '';
  const display = {...spec};
  if (display.response_engine) display.response_engine = {...display.response_engine, system_prompt: '(see Agent Prompt tab)'};
  return `<div class="card">
    <div class="card-title">Retell Agent Spec — ${ver.toUpperCase()}</div>
    <pre>${escHtml(JSON.stringify(display, null, 2))}</pre>
  </div>`;
}

function sourceBadge(source) {
  if (source === 'onboarding_form') return '<span class="source-badge source-form">form</span>';
  if (source === 'onboarding') return '<span class="source-badge source-transcript">call</span>';
  return '';
}

function changeRows(arr) {
  if (!arr.length) return '<em class="no-data">None</em>';
  return arr.map(c=>`
    <div class="diff-row">
      <span class="field-path">${escHtml(c.field_path)}${sourceBadge(c.source)}</span>
      <span class="diff-old">${c.change_type === 'added' ? '' : escHtml(truncate(c.old_value))}</span>
      <span class="diff-new">${c.change_type === 'removed' ? '' : escHtml(truncate(c.new_value))}</span>
      <span class="diff-reason">${escHtml(c.reason||'')}</span>
    </div>`).join('');
}

function renderFormConflicts(formPatch) {
  if (!formPatch) return '';
  const conflicts = formPatch.conflicts || [];
  const meta = formPatch._metadata || {};
  const clarified = meta._fields_clarified || 0;
  const patchCount = (formPatch.patches || []).length;
  if (!patchCount && !conflicts.length) return '';

  const conflictRows = conflicts.map(c => `
    <div class="conflict-row">
      <span class="field-path">${escHtml(c.field)}</span>
      <span class="diff-old">${escHtml(truncate(c.v1_value))}</span>
      <span class="diff-new">${escHtml(truncate(c.form_value))}</span>
      <span class="conflict-resolution">${escHtml(c.resolution||'form overrides v1')}${c.requires_review ? ' <strong style="color:var(--warn)">[review]</strong>' : ''}</span>
    </div>`).join('');

  return `<div class="card" style="border-color:var(--accent)">
    <div class="card-title" style="color:var(--accent)">Onboarding Form Merge</div>
    <div style="display:flex;gap:1rem;margin-bottom:0.75rem;flex-wrap:wrap">
      <span class="source-badge source-form" style="font-size:0.75rem;padding:2px 8px">form source</span>
      <span style="font-size:0.8rem;color:var(--muted)">${patchCount} patch(es) applied</span>
      ${clarified ? `<span style="font-size:0.8rem;color:var(--accent2)">${clarified} blank field(s) clarified</span>` : ''}
      ${conflicts.length ? `<span style="font-size:0.8rem;color:var(--danger)">${conflicts.length} conflict(s) resolved</span>` : ''}
    </div>
    ${conflicts.length ? `
    <div class="diff-row" style="font-weight:600;font-size:0.75rem;color:var(--muted)">
      <span>Field</span><span>Demo Value</span><span>Form Value</span><span>Resolution</span>
    </div>${conflictRows}` : '<em class="no-data">No conflicts — form data merged cleanly.</em>'}
  </div>`;
}

function renderDiff(v2) {
  if (!v2) return '<em class="no-data">No v2 data.</em>';
  const cl = v2.changelog;
  if (!cl) return `<div class="card"><div class="card-title">Changelog</div><pre>${escHtml(v2.changelog_md||'No changelog generated.')}</pre></div>`;

  const changes = cl.changes || [];
  const modified = changes.filter(c=>c.change_type==='modified');
  const added = changes.filter(c=>c.change_type==='added');
  const removed = changes.filter(c=>c.change_type==='removed');
  const formSourced = changes.filter(c=>c.source==='onboarding_form').length;

  return `
    <div class="grid-3">
      <div class="stat-box"><div class="num" style="color:var(--warn)">${modified.length}</div><div class="label">Modified</div></div>
      <div class="stat-box"><div class="num" style="color:var(--accent2)">${added.length}</div><div class="label">Added</div></div>
      <div class="stat-box"><div class="num" style="color:var(--danger)">${removed.length}</div><div class="label">Removed</div></div>
    </div><br>
    <div class="card">
      <div class="card-title">Summary</div>
      <p>${escHtml(cl.summary)}</p>
      ${formSourced ? `<p style="color:var(--accent);font-size:0.82rem;margin-top:0.4rem">${formSourced} change(s) sourced from onboarding form <span class="source-badge source-form">form</span></p>` : ''}
      <p style="color:var(--muted);font-size:0.8rem;margin-top:0.5rem">Generated: ${escHtml(cl.generated_at)}</p>
    </div>
    ${renderFormConflicts(v2.form_patch)}
    ${modified.length?`<div class="card"><div class="card-title">Modified Fields</div>
      <div class="diff-row" style="font-weight:600;font-size:0.75rem;color:var(--muted)">
        <span>Field</span><span>Before</span><span>After</span><span>Reason</span>
      </div>${changeRows(modified)}</div>`:''}
    ${added.length?`<div class="card"><div class="card-title">Added Fields</div>${changeRows(added)}</div>`:''}
    ${removed.length?`<div class="card"><div class="card-title">Removed Fields</div>${changeRows(removed)}</div>`:''}
    <div class="card">
      <div class="card-title">Full Changelog (Markdown)</div>
      <pre>${escHtml(v2.changelog_md||'')}</pre>
    </div>
  `;
}

await loadAccounts();
await loadSummary();
</script>
</body>
</html>
