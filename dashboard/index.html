<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clara Pipeline — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --muted: #8892b0;
      --radius: 10px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .logo span { color: var(--accent2); }
    .badge {
      background: var(--accent);
      color: white;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 60px); }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem 0;
    }
    .sidebar-title {
      padding: 0.5rem 1.25rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
    }
    .account-item {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .account-item:hover { background: var(--surface2); }
    .account-item.active {
      background: var(--surface2);
      border-left-color: var(--accent);
    }
    .account-item .name { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
    .account-item .meta { font-size: 0.75rem; color: var(--muted); }
    .v2-tag {
      display: inline-block;
      background: var(--accent2);
      color: #0a1628;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }
    .main { overflow-y: auto; padding: 1.5rem 2rem; }
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      gap: 0.75rem;
    }
    .placeholder .icon { font-size: 3rem; }
    .placeholder p { font-size: 0.9rem; }
    .tabs { display: flex; gap: 0.25rem; margin-bottom: 1.5rem; }
    .tab {
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-bottom: none;
      background: var(--surface);
      color: var(--muted);
      transition: all 0.15s;
    }
    .tab.active { background: var(--surface2); color: var(--text); border-color: var(--border); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent2);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .field { margin-bottom: 0.6rem; }
    .field-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .field-value { font-size: 0.9rem; }
    .pill {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.8rem;
      margin: 2px 2px;
    }
    .contact-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .contact-order {
      background: var(--accent);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    pre {
      background: #0a0d15;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
    }
    .diff-section { margin-bottom: 1rem; }
    .diff-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 0.5rem; }
    .diff-row {
      display: grid;
      grid-template-columns: 200px 1fr 1fr 1fr;
      gap: 0.5rem;
      padding: 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.25rem;
      font-size: 0.8rem;
      align-items: center;
    }
    .diff-row:nth-child(odd) { background: var(--surface2); }
    .diff-row .field-path { font-family: monospace; color: var(--accent); }
    .diff-old { color: var(--danger); }
    .diff-new { color: var(--accent2); }
    .diff-reason { color: var(--muted); font-style: italic; }
    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat-box .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-box .label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .summary-row {
      display: grid;
      grid-template-columns: 160px 120px 80px 1fr 80px;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.83rem;
      align-items: center;
    }
    .summary-row:nth-child(odd) { background: var(--surface2); }
    .status-ok { color: var(--accent2); font-weight: 600; }
    .status-fail { color: var(--danger); font-weight: 600; }
    .loading { color: var(--muted); font-size: 0.9rem; padding: 2rem; text-align: center; }
    .no-data { color: var(--muted); font-style: italic; font-size: 0.85rem; padding: 0.5rem 0; }
    h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .separator { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
  </style>
</head>
<body>

<header>
  <div class="logo">Clara<span>Pipeline</span></div>
  <div class="badge">v1.0</div>
  <span style="margin-left:auto; color:var(--muted); font-size:0.85rem;" id="header-status">Loading...</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">Accounts</div>
    <div id="account-list"><div class="loading">Loading...</div></div>
  </aside>

  <main class="main" id="main-content">
    <div class="placeholder">
      <div class="icon">🏢</div>
      <h3>Select an account</h3>
      <p>Choose an account from the sidebar to view its configuration,<br>agent spec, and changelog.</p>
    </div>
  </main>
</div>

<script>
const API = '';

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function escHtml(s) {
  if (s == null) return '<em class="no-data">—</em>';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pills(arr) {
  if (!arr || !arr.length) return '<em class="no-data">None</em>';
  return arr.map(s => `<span class="pill">${escHtml(s)}</span>`).join('');
}

async function loadAccounts() {
  try {
    const accounts = await fetchJSON(`${API}/api/accounts`);
    const el = document.getElementById('account-list');
    if (!accounts.length) {
      el.innerHTML = '<div class="loading">No accounts found.<br>Run the batch runner first.</div>';
      document.getElementById('header-status').textContent = '0 accounts';
      return;
    }
    document.getElementById('header-status').textContent = `${accounts.length} account${accounts.length===1?'':'s'}`;
    el.innerHTML = accounts.map(a => `
      <div class="account-item" onclick="loadAccount('${a.account_id}')" id="item-${a.account_id}">
        <div class="name">${escHtml(a.company_name)}${a.has_v2?'<span class="v2-tag">v2</span>':''}</div>
        <div class="meta">${a.account_id} &middot; ${a.versions.join(', ')}</div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('account-list').innerHTML = `<div class="loading" style="color:var(--danger)">Error: ${e.message}</div>`;
  }
}

async function loadAccount(accountId) {
  document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById(`item-${accountId}`);
  if (item) item.classList.add('active');

  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Loading account data...</div>';

  try {
    const data = await fetchJSON(`${API}/api/account/${accountId}`);
    if (data.error) throw new Error(data.error);
    renderAccount(data, main);
  } catch(e) {
    main.innerHTML = `<div class="placeholder"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
  }
}

function renderAccount(data, container) {
  const v1 = data.v1 || {};
  const v2 = data.v2;
  const memo = v1.memo || {};
  const spec = v1.agent_spec || {};
  const bh = memo.business_hours || {};
  const er = memo.emergency_routing_rules || {};

  const tabsHTML = `
    <div class="tabs">
      <div class="tab active" onclick="showTab('overview')">Overview</div>
      <div class="tab" onclick="showTab('memo')">Account Memo</div>
      <div class="tab" onclick="showTab('prompt')">Agent Prompt</div>
      <div class="tab" onclick="showTab('spec')">Agent Spec JSON</div>
      ${v2 ? '<div class="tab" onclick="showTab(\'diff\')">v1 → v2 Diff</div>' : ''}
    </div>
    <div id="tab-overview" class="tab-pane active">${renderOverview(data)}</div>
    <div id="tab-memo" class="tab-pane">${renderMemo(v1.memo, 'v1')}${v2 ? renderMemo(v2.memo,'v2') : ''}</div>
    <div id="tab-prompt" class="tab-pane">${renderPrompt(v1.system_prompt, 'v1')}${v2&&v2.system_prompt?renderPrompt(v2.system_prompt,'v2'):''}</div>
    <div id="tab-spec" class="tab-pane">${renderSpec(v1.agent_spec, 'v1')}${v2&&v2.agent_spec?renderSpec(v2.agent_spec,'v2'):''}</div>
    ${v2 ? `<div id="tab-diff" class="tab-pane">${renderDiff(v2)}</div>` : ''}
  `;

  container.innerHTML = `
    <h2>${escHtml(memo.company_name || data.account_id)}</h2>
    <p class="subtitle">${data.account_id} &mdash; ${escHtml(memo.office_address || '')}</p>
    ${tabsHTML}
  `;
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['overview','memo','prompt','spec','diff'];
    t.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => {
    p.classList.toggle('active', p.id === `tab-${name}`);
  });
}

function renderOverview(data) {
  const m = data.v1?.memo || {};
  const bh = m.business_hours || {};
  const er = m.emergency_routing_rules || {};
  const contacts = (er.contacts||[]).sort((a,b)=>a.order-b.order);

  return `
    <div class="grid-3">
      <div class="stat-box"><div class="num">${(m.services_supported||[]).length}</div><div class="label">Services</div></div>
      <div class="stat-box"><div class="num">${contacts.length}</div><div class="label">Emergency Contacts</div></div>
      <div class="stat-box"><div class="num">${data.v2?'v2':'v1'}</div><div class="label">Current Version</div></div>
    </div>
    <br>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Business Hours</div>
        <div class="field"><div class="field-label">Days</div><div class="field-value">${pills(bh.days)}</div></div>
        <div class="field"><div class="field-label">Hours</div><div class="field-value">${escHtml(bh.start)} – ${escHtml(bh.end)}</div></div>
        <div class="field"><div class="field-label">Timezone</div><div class="field-value">${escHtml(bh.timezone)}</div></div>
      </div>
      <div class="card">
        <div class="card-title">Services</div>
        ${pills(m.services_supported)}
      </div>
    </div>
    <div class="card">
      <div class="card-title">Emergency Contacts (in order)</div>
      ${contacts.map(c=>`
        <div class="contact-card">
          <div class="contact-order">${c.order}</div>
          <div><strong>${escHtml(c.name)}</strong><br><span style="color:var(--muted);font-size:0.85rem">${escHtml(c.phone)}</span></div>
        </div>`).join('') || '<em class="no-data">None on file</em>'}
      ${er.fallback?`<div style="margin-top:0.75rem"><span class="field-label">Fallback: </span>${escHtml(er.fallback)}</div>`:''}
    </div>
    <div class="card">
      <div class="card-title">Integration Constraints</div>
      ${pills(m.integration_constraints)}
    </div>
    ${(m.questions_or_unknowns||[]).length ? `
    <div class="card" style="border-color: var(--warn);">
      <div class="card-title" style="color:var(--warn)">Open Questions / Unknowns</div>
      ${pills(m.questions_or_unknowns)}
    </div>` : ''}
  `;
}

function renderMemo(memo, ver) {
  if (!memo) return '';
  return `
    <div class="card">
      <div class="card-title">Account Memo — ${ver.toUpperCase()}</div>
      <pre>${escHtml(JSON.stringify(memo, null, 2))}</pre>
    </div>
  `;
}

function renderPrompt(prompt, ver) {
  if (!prompt) return '<em class="no-data">Prompt not generated yet.</em>';
  return `
    <div class="card">
      <div class="card-title">System Prompt — ${ver.toUpperCase()}</div>
      <pre>${escHtml(prompt)}</pre>
    </div>
  `;
}

function renderSpec(spec, ver) {
  if (!spec) return '';
  // Show spec without the (long) system prompt to keep it readable
  const display = {...spec};
  if (display.response_engine) display.response_engine = {...display.response_engine, system_prompt: '(see Agent Prompt tab)'};
  return `
    <div class="card">
      <div class="card-title">Retell Agent Spec — ${ver.toUpperCase()}</div>
      <pre>${escHtml(JSON.stringify(display, null, 2))}</pre>
    </div>
  `;
}

function renderDiff(v2) {
  if (!v2) return '<em class="no-data">No v2 data.</em>';
  const cl = v2.changelog;
  if (!cl) return `<div class="card"><div class="card-title">Changelog</div><pre>${escHtml(v2.changelog_md||'No changelog generated.')}</pre></div>`;

  const changes = cl.changes || [];
  const modified = changes.filter(c=>c.change_type==='modified');
  const added = changes.filter(c=>c.change_type==='added');
  const removed = changes.filter(c=>c.change_type==='removed');

  const summaryCards = `
    <div class="grid-3">
      <div class="stat-box"><div class="num" style="color:var(--warn)">${modified.length}</div><div class="label">Modified</div></div>
      <div class="stat-box"><div class="num" style="color:var(--accent2)">${added.length}</div><div class="label">Added</div></div>
      <div class="stat-box"><div class="num" style="color:var(--danger)">${removed.length}</div><div class="label">Removed</div></div>
    </div><br>
  `;

  function changeRows(arr) {
    if (!arr.length) return '<em class="no-data">None</em>';
    return arr.map(c=>`
      <div class="diff-row">
        <span class="field-path">${escHtml(c.field_path)}</span>
        <span class="diff-old">${c.change_type!=='added'?escHtml(truncate(c.old_value)):''}</span>
        <span class="diff-new">${c.change_type!=='removed'?escHtml(truncate(c.new_value)):''}</span>
        <span class="diff-reason">${escHtml(c.reason||'')}</span>
      </div>`).join('');
  }

  return summaryCards + `
    <div class="card">
      <div class="card-title">Summary</div>
      <p>${escHtml(cl.summary)}</p>
      <p style="color:var(--muted);font-size:0.8rem;margin-top:0.5rem">Generated: ${escHtml(cl.generated_at)}</p>
    </div>
    ${modified.length?`<div class="card"><div class="card-title">Modified Fields</div>
      <div class="diff-row" style="font-weight:600;font-size:0.75rem;color:var(--muted)">
        <span>Field</span><span>Before</span><span>After</span><span>Reason</span>
      </div>${changeRows(modified)}</div>`:''}
    ${added.length?`<div class="card"><div class="card-title">Added Fields</div>${changeRows(added)}</div>`:''}
    ${removed.length?`<div class="card"><div class="card-title">Removed Fields</div>${changeRows(removed)}</div>`:''}
    <div class="card">
      <div class="card-title">Full Changelog (Markdown)</div>
      <pre>${escHtml(v2.changelog_md||'')}</pre>
    </div>
  `;
}

function truncate(val, n=80) {
  if (val == null) return '—';
  const s = typeof val === 'object' ? JSON.stringify(val) : String(val);
  return s.length > n ? s.slice(0, n) + '…' : s;
}

loadAccounts();
</script>
</body>
</html>
